<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link rel="stylesheet" href="../css/login_style.css" />
    <link rel="stylesheet" href="../css/sweetalert2.min.css" />

    <link
      rel="icon"
      type="image/png"
      href="../image/logo-nobackground-circle.png"
    />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="left-panel" aria-label="left logo and description">
        <div class="left-logo">
          <a href="../index.html">
            <img
              src="../image/logo-nobackground-circle.png"
              alt="NovelNest logo"
            />
          </a>
        </div>
        <h2>NovelNest</h2>
        <p>
          Free stories that come alive and free knowledge that finds its home.
        </p>
      </div>

      <!-- RIGHT SIDE: Sign up form -->
      <div class="login-card" role="main" aria-label="Sign up card">
        <div class="signup-header">
          <h1>Sign Up</h1>
          <p>
            Already have an Account?
            <a href="user_login.html" class="login-link">Login</a>
          </p>
        </div>

        <form
          class="login-form"
          data-role="reader"
          action="#"
          method="POST"
          autocomplete="on"
        >
          <div class="input-group">
            <label for="fullname">User Name</label>
            <input
              type="text"
              id="reader_username"
              name="username"
              placeholder="John Doe"
              autofocus
            />
          </div>

          <div class="input-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="reader_email"
              name="email"
              placeholder="JohnDoe@gmail.com"
            />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="reader_password"
              name="password"
              placeholder="Enter your password"
              minlength="6"
            />
          </div>

          <div class="input-group">
            <label for="number">Phone Number</label>
            <input
              type="tel"
              id="reader_number"
              name="number"
              placeholder="09XX XXX XXXX"
              pattern="[0-9]{11}"
            />
          </div>

          <button type="submit" class="btn-login">Sign Up</button>
        </form>
      </div>
      <!-- end login-card -->
    </div>
    <!-- end login-wrapper -->
    <script src="../sweetalert2.all.min.js"></script>
    <script src="../login.js"></script>
  </body>
</html>
