<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>
<div class="layout">
 
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="nav-item active">Dashboard</div>
    <div class="nav-item">Manage Users</div>
    <div class="nav-item">Manage Books</div>
    <div class="nav-item">Ads Performance</div>
    <div class="nav-item">Archive</div>
    <div class="nav-item logout">Log Out</div>
  </div>
 
  <!-- Main content -->
  <div class="main">
    <div class="topbar">
      <span class="avatar">👤</span>
      Welcome Admin
    </div>
 
    <div class="grid-top">
      <!-- Advertisement Revenue -->
      <div class="card">
        <div class="card-label">Advertisement Revenue</div>
        <div class="card-value">100</div>
        <div class="chart-wrap">
          <div class="pie"></div>
        </div>
        <div class="legend">
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--purple)"></span>Advertisement 1</span><span class="pct">25%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--blue)"></span>Advertisement 2</span><span class="pct">25%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--orange)"></span>Advertisement 3</span><span class="pct">25%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--green)"></span>Advertisement 4</span><span class="pct">25%</span></div>
        </div>
      </div>
 
      <!-- Popular Genre -->
      <div class="card">
        <div class="card-label">Popular Genre</div>
        <div class="card-value">00</div>
        <div class="chart-wrap">
          <div class="bar-chart">
            <div class="bar" style="height:20%; background:var(--purple);"></div>
            <div class="bar" style="height:90%; background:var(--blue);"></div>
            <div class="bar" style="height:30%; background:var(--orange);"></div>
            <div class="bar" style="height:80%; background:var(--green);"></div>
          </div>
        </div>
        <div class="legend">
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--purple)"></span>Action</span><span class="pct">20%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--blue)"></span>Fantasy</span><span class="pct">90%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--orange)"></span>Thriller</span><span class="pct">30%</span></div>
          <div class="legend-item"><span class="name"><span class="dot" style="background:var(--green)"></span>Romance</span><span class="pct">80%</span></div>
        </div>
      </div>
    </div>
 
    <!-- Number of Users -->
    <div class="card users-card">
      <div class="users-row">
        <div class="stat">
          <div class="card-label">Number of Users</div>
          <div class="card-value">354</div>
        </div>
        <div class="chart-wrap">
          <svg class="line-chart" viewBox="0 0 300 100" preserveAspectRatio="none">
            <path d="M0,70 L20,55 L40,62 L60,50 L80,58 L100,40 L120,45 L140,28 L160,35 L180,18 L200,24 L220,10 L240,15 L260,5 L280,12 L300,2" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
 
</body>
</html>
