<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reported Novels</title>

    <link rel="stylesheet" href="../css/admin_reported-novels.css" />
    <link rel="stylesheet" href="../css/sweetalert2.min.css" />

    <link
      rel="icon"
      type="image/png"
      href="../image/logo-nobackground-circle.png"
    />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="../image/logocopy.png" alt="brandlogo" />NovelNest
        </div>

        <nav class="nav">
          <a href="admin.html" class="nav-item"> Dashboard </a>
          <a href="admin_all-novels.html" class="nav-item sub">All Novels</a>
          <a href="admin_pending-novel.html" class="nav-item sub"
            >Pending Novels</a
          >
          <a href="admin_reported-novels.html" class="nav-item sub active"
            >Reported Novels</a
          >
          <a href="admin_manage-user.html" class="nav-item sub"
            >Manage Readers</a
          >
          <a href="admin_manage-author.html" class="nav-item sub"
            >Manage Authors</a
          >
          <a href="admin_ad-management.html" class="nav-item sub"
            >Ad Management</a
          >
          <a href="admin_revenue-reports.html" class="nav-item sub"
            >Revenue Reports</a
          >
          <a href="admin_archive.html" class="nav-item sub">Archive</a>
        </nav>

        <a href="#" class="logout" id="logout" data-role="admin"> Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>REPORTED NOVELS</h1>

          <div class="user-chip">
            <span>Welcome, Admin</span>
            <div class="avatar">A</div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <label for="search"> Search </label>
            <input
              type="text"
              id="search"
              placeholder="Search reported novels..."
            />
          </div>

          <div class="filter-group">
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="warned">Warned</option>
              <option value="archived">Archived</option>
              <option value="banned">Banned</option>
              <option value="appealed">Appealed</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="reason-filter">Reason</label>
            <select id="reason-filter">
              <option value="all">All Reasons</option>
              <option value="broken content">Broken Content</option>
              <option value="missing content">Missing Content</option>
              <option value="wrong chapter">Wrong Chapter</option>
              <option value="inappropriate content">
                Inappropriate Content
              </option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <!-- Bulk Action Bar -->
        <div class="bulk-action-bar" id="bulkActionBar">
          <span id="bulkCount">0</span> reports selected
          <div class="bulk-buttons">
            <button class="btn btn-sm btn-secondary" id="bulkWarnBtn">
              Warn Selected
            </button>
            <button class="btn btn-sm btn-danger" id="bulkArchiveBtn">
              Archive Selected
            </button>
            <button class="btn btn-sm btn-success" id="bulkResolveBtn">
              Resolve Selected
            </button>
          </div>
        </div>

        <div class="table-card">
          <h2>Reported Novels</h2>

          <table>
            <thead>
              <tr>
                <th style="width: 44px">
                  <input type="checkbox" id="selectAllCheckbox" />
                </th>
                <th>Novel &amp; Chapter</th>
                <th style="width: 170px">Report Reason</th>
                <th style="width: 170px">Reported By</th>
                <th style="width: 120px">Status</th>
                <th style="width: 130px">Action</th>
              </tr>
            </thead>

            <tbody id="reportedTableBody">
              <!-- JS will populate this dynamically -->
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- ===== ADMIN VIEW REPORT MODAL ===== -->
    <div
      class="report-modal-overlay"
      id="viewReportModalOverlay"
      aria-hidden="true"
    >
      <div
        class="report-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="viewReportModalTitle"
      >
        <div class="report-modal-header">
          <h3 id="viewReportModalTitle" class="report-modal-title">
            Report Details
          </h3>
          <button
            type="button"
            class="report-modal-close"
            id="viewReportModalClose"
            aria-label="Close dialog"
          >
            &times;
          </button>
        </div>

        <div class="report-modal-body">
          <div class="report-detail-group">
            <label class="report-modal-label">Novel Title</label>
            <p class="report-detail-value fw-600" id="modalNovel">-</p>
          </div>

          <div class="report-detail-group">
            <label class="report-modal-label">Author</label>
            <p class="report-detail-value" id="modalAuthor">-</p>
          </div>

          <div class="report-detail-group">
            <label class="report-modal-label">Reported By</label>
            <p class="report-detail-value" id="modalUser">-</p>
          </div>

          <div class="report-detail-group">
            <label class="report-modal-label">Reason</label>
            <p class="report-detail-value text-danger" id="modalReason">-</p>
          </div>

          <div class="report-detail-group">
            <label class="report-modal-label">Original Report Details</label>
            <p class="report-details-box" id="modalDetails">-</p>
          </div>

          <!-- Appeal Reason Section -->
          <div
            class="report-detail-group"
            id="appealReasonGroup"
            style="display: none"
          >
            <label class="report-modal-label" style="color: var(--link-hover)"
              >Author's Appeal Message</label
            >
            <p
              class="report-details-box"
              id="modalAppealReason"
              style="
                background: rgba(59, 111, 145, 0.05);
                border-color: var(--link-hover);
              "
            >
              -
            </p>
          </div>
        </div>

        <div class="report-modal-footer footer-space-between">
          <button
            type="button"
            class="report-modal-btn report-modal-btn-dismiss"
            id="modalDismissBtn"
          >
            Dismiss Report
          </button>

          <div class="footer-actions">
            <button
              type="button"
              class="report-modal-btn report-modal-btn-cancel"
              id="modalCloseBtn"
            >
              Close
            </button>
            <button
              type="button"
              class="report-modal-btn report-modal-btn-submit"
              id="modalActionBtn"
            >
              Take Action
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../javascript/sweetalert2.all.min.js"></script>
    <script src="../javascript/admin_reported-novels.js"></script>
    <script src="../javascript/logout.js"></script>
  </body>
</html>
