<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Novel</title>
    <link rel="stylesheet" href="../css/admin_view-novel.css" />
    <link rel="stylesheet" href="../css/sweetalert2.min.css" />
    <link
      rel="icon"
      type="image/png"
      href="../image/logo-nobackground-circle.png"
    />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="../image/logocopy.png" alt="brandlogo" />NovelNest
        </div>
        <nav class="nav">
          <a href="admin.html" class="nav-item">
            <span class="nav-icon"></span> Dashboard
          </a>
          <a href="admin_all-novels.html" class="nav-item sub active"
            >All Novels</a
          >
          <a href="admin_pending-novel.html" class="nav-item sub"
            >Pending Novels</a
          >
          <a href="admin_reported-novels.html" class="nav-item sub"
            >Reported Novels</a
          >
          <a href="admin_manage-user.html" class="nav-item sub">Manage Users</a>
          <a href="admin_manage-author.html" class="nav-item sub"
            >Manage Authors</a
          >
          <a href="admin_ad-management.html" class="nav-item sub"
            >Ad Management</a
          >
          <a href="admin_revenue-reports.html" class="nav-item sub"
            >Revenue Reports</a
          >
          <a href="admin_archive.html" class="nav-item sub">Archive</a>
        </nav>
        <a href="#" class="logout" id="logout" data-role="admin"> Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="topbar-left">
            <a href="admin_all-novels.html" class="back-link">
              <img src="../icons/backbtn.svg" alt="backbtn" />All Novels</a
            >
            <h1 id="headerNovelTitle">Loading...</h1>
          </div>
          <div class="user-chip">
            <span>Welcome, Admin</span>
            <span class="avatar">A</span>
          </div>
        </div>

        <div class="action-bar">
          <div class="action-left">
            <span class="badge active" id="novelStatusBadge">Ongoing</span>
            <span class="meta-text" id="novelMetaText"
              >Last updated recently</span
            >
          </div>
        </div>

        <fieldset disabled="disabled">
          <section class="novel-header">
            <div class="novel-cover">
              <img
                id="novelCoverImg"
                src="../image/logo-nobackground-circle.png"
                alt="Cover"
              />
            </div>
            <div class="novel-details">
              <div id="viewMode">
                <h2 id="titleView">Loading...</h2>
                <p class="novel-subtitle" id="subtitleView"></p>

                <!-- Added Icons here using .meta-item -->
                <div
                  class="meta-row"
                  style="margin-top: 12px; margin-bottom: 20px"
                >
                  <div class="meta-item">
                    <img src="../icons/author.svg" alt="author icon" />
                    <span id="novelAuthor"></span>
                  </div>
                  <div class="meta-item">
                    <img src="../icons/book-half.svg" alt="genre icon" />
                    <span id="novelGenre"></span>
                  </div>
                </div>

                <h3 class="section-title">Synopsis</h3>
                <p class="synopsis" id="synopsisView"></p>
              </div>
            </div>
          </section>
        </fieldset>

        <section class="table-card">
          <div class="chapter-card-header">
            <h2>Chapters</h2>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 60px">#</th>
                <th>Chapter Title</th>
                <th style="width: 140px">Status</th>
                <th style="width: 120px">Words</th>
                <th style="width: 160px">Last Updated</th>
                <th style="width: 260px">Actions</th>
              </tr>
            </thead>
            <tbody id="chapterTableBody">
              <!-- JS will populate this dynamically -->
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="../javascript/sweetalert2.all.min.js"></script>
    <script src="../javascript/admin-view-novel.js"></script>
    <script src="../javascript/logout.js"></script>
  </body>
</html>
