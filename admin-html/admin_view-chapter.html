<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Chapter</title>
    <link rel="stylesheet" href="../css/admin_view-chapter.css" />
    <link rel="stylesheet" href="../css/sweetalert2.min.css" />
    <link
      rel="icon"
      type="image/png"
      href="../image/logo-nobackground-circle.png"
    />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="../image/logocopy.png" alt="brandlogo" />NovelNest
        </div>
        <nav class="nav">
          <a href="admin.html" class="nav-item">
            <span class="nav-icon"></span> Dashboard
          </a>
          <a href="admin_all-novels.html" class="nav-item sub active"
            >All Novels</a
          >
          <a href="admin_pending-novel.html" class="nav-item sub"
            >Pending Novels</a
          >
          <a href="admin_reported-novels.html" class="nav-item sub"
            >Reported Novels</a
          >
          <a href="admin_manage-user.html" class="nav-item sub"
            >Manage Readers</a
          >
          <a href="admin_manage-author.html" class="nav-item sub"
            >Manage Authors</a
          >
          <a href="admin_ad-management.html" class="nav-item sub"
            >Ad Management</a
          >
          <a href="admin_revenue-reports.html" class="nav-item sub"
            >Revenue Reports</a
          >
          <a href="admin_archive.html" class="nav-item sub">Archive</a>
        </nav>
        <a href="#" class="logout" id="logout" data-role="admin"> Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="topbar-left">
            <a href="#" class="back-link" id="backToNovelBtn">
              <img src="../icons/backbtn.svg" alt="backbtn" />Back to View</a
            >
            <h1>View Chapter</h1>
          </div>
          <div class="user-chip">
            <span>Welcome, Admin</span>
            <span class="avatar">A</span>
          </div>
        </div>

        <fieldset disabled="disabled">
          <div>
            <div class="meta-bar">
              <div class="meta-left">
                <span class="chapter-num" id="metaChapterNum">Chapter 1</span>
                <span class="meta-sep">·</span>
                <span class="novel-name" id="metaNovelName">Loading...</span>
                <span class="badge active" id="statusBadge">Published</span>
              </div>
            </div>

            <div class="form-container">
              <div class="form-group">
                <label>Chapter Title</label>
                <input type="text" id="chapterTitle" value="" />
              </div>

              <div class="form-grid-2">
                <div class="form-group">
                  <label>Chapter Number</label>
                  <input type="number" id="chapterNumber" value="1" />
                </div>
                <div class="form-group">
                  <label>Author's Note</label>
                  <textarea id="authorNote" class="note-textarea"></textarea>
                </div>
              </div>

              <div class="form-group-full">
                <textarea
                  id="chapterContent"
                  class="editor-area"
                  spellcheck="true"
                ></textarea>
              </div>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="button" class="btn btn-danger" id="archiveBtn">
            Archive Chapter
          </button>
          <span class="spacer"></span>
        </div>
      </main>
    </div>

    <script src="../javascript/sweetalert2.all.min.js"></script>
    <script src="../javascript/logout.js"></script>
    <script src="../javascript/admin_edit-chapter.js"></script>
  </body>
</html>
