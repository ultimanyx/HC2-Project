<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-card" role="main" aria-label="Sign up card">

    <!-- Header with "Login" link -->
    <div class="signup-header">
      <h1>Sign Up</h1>
      <p>
        Already have an Account?
        <a href="user_login.html" class="login-link">Login</a>
      </p>
    </div>

    <!-- Sign-Up Form -->
    <form class="login-form" action="#" method="POST" autocomplete="on">

      <!-- Full Name -->
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="John Doe"
          required
          autofocus
        />
      </div>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="JohnDoe@gmail.com"
          required
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          minlength="6"
        />
      </div>

      <!-- Submit Button (full-width link) -->
      <a href="user_login.html" class="btn-login">Sign Up</a>

    </form>

  </div>

</body>
</html>
