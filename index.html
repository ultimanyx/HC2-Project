<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - NovelNest</title>

    <link rel="stylesheet" href="./css/login_style.css" />
    <link rel="stylesheet" href="./css/sweetalert2.min.css" />
    <link
      rel="icon"
      type="image/png"
      href="./image/logo-nobackground-circle.png"
    />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- LEFT PANEL -->
      <div class="left-panel" aria-label="left logo and description">
        <div class="left-logo">
          <a href="index.html">
            <img
              src="./image/logo-nobackground-circle.png"
              alt="NovelNest logo"
            />
          </a>
        </div>
        <h2>NovelNest</h2>
        <p>
          Free stories that come alive and free knowledge that finds its home.
        </p>
      </div>

      <!-- RIGHT PANEL: LOGIN CARD -->
      <div class="login-card" role="main" aria-label="Login card">
        <div class="login-header">
          <h1>Welcome to NovelNest</h1>
          <p>Sign in to your account</p>
        </div>

        <form class="login-form" id="login-form">
          <div class="input-group">
            <label for="login_email">Email address</label>
            <input
              type="email"
              id="login_email"
              name="email"
              placeholder="you@example.com"
              required
              autofocus
            />
          </div>

          <div class="input-group">
            <label for="login_password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="login_password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                data-target="login_password"
              >
                <span class="icon-show"
                  ><img src="./icons/eye-opened.svg" alt="Show"
                /></span>
                <span class="icon-hide"
                  ><img src="./icons/eye-closed.svg" alt="Hide"
                /></span>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="login-footer">
          Don't have an account? <a href="sign-up.html">Create one</a>
        </div>
      </div>
    </div>

    <script src="./javascript/sweetalert2.all.min.js"></script>
    <script src="./javascript/login.js"></script>
  </body>
</html>
