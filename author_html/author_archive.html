<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive · NovelNest</title>
    <link rel="stylesheet" href="../css/author_archive.css" />
    <link rel="stylesheet" href="../css/sweetalert2.min.css" />
    <link
      rel="icon"
      type="image/png"
      href="../image/logo-nobackground-circle.png"
    />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="../image/logocopy.png" alt="brandlogo" />
          NovelNest
        </div>
        <nav class="nav">
          <a href="author_dashboard.html" class="nav-item sub">
            <span class="nav-icon"></span>Dashboard
          </a>
          <a href="author_all-novel.html" class="nav-item sub"> All Novels </a>
          <a href="author_create-novel.html" class="nav-item sub">
            Create Novel
          </a>
          <a href="author_draft-novel.html" class="nav-item sub">
            Draft Novel
          </a>
          <a href="author_earnings.html" class="nav-item sub">Earnings</a>
          <a href="author_archive.html" class="nav-item sub active">Archive</a>
        </nav>
        <a href="#" class="logout" id="logout" data-role="author">Logout</a>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Archive</h1>
          <div class="user-chip">
            <span id="authorName">Sarah J.</span>
            <span class="avatar" id="authorAvatar">SJ</span>
          </div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Archived Items</div>
            <div class="stat-value" id="stat-archived">0</div>
            <div class="stat-change warning">Currently archived</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Recovery Bin</div>
            <div class="stat-value" style="font-size: 18px; padding-top: 12px">
              Soft Deleted
            </div>
            <div class="stat-change positive">Restore or Delete</div>
          </div>
        </div>

        <div class="table-card">
          <h2>Archived Items</h2>
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th>Title</th>
                <th>Archived On</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="../javascript/sweetalert2.all.min.js"></script>
    <script src="../javascript/name-change.js"></script>
    <script src="../javascript/author_archive.js"></script>
    <script src="../javascript/logout.js"></script>
  </body>
</html>
